<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Motorola - HULK CELL</title>
    <!-- Esto es lo que faltaba: La conexión al diseño -->
    <script src="https://tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
        body { background-color: #0a0a0a; color: #e8e8e8; }
        .hulk-border { border-color: #4CAF50; }
        .hulk-text { color: #4CAF50; }
    </style>
</head>
<body>

    <!-- Header -->
    <nav class="bg-black/90 p-5 border-b hulk-border/30 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <a href="index.html" class="text-2xl font-black hulk-text tracking-tighter">HULK CELL</a>
            <a href="index.html" class="text-sm font-bold hover:hulk-text transition uppercase tracking-widest">
                <i class="fas fa-chevron-left mr-2"></i> Volver al Inicio
            </a>
        </div>
    </nav>

    <!-- Hero Banner -->
    <div class="relative h-80 w-full">
        <img src="https://unsplash.com" 
             alt="Motorola" class="w-full h-full object-cover opacity-40">
        <div class="absolute inset-0 flex flex-col items-center justify-center">
            <h1 class="text-6xl font-black italic tracking-tighter uppercase">MOTOROLA</h1>
            <div class="h-1 w-24 bg-green-500 mt-2"></div>
        </div>
    </div>

    <!-- Lista de Inventario -->
    <div class="max-w-5xl mx-auto px-4 py-12">
        <div class="bg-gray-900 border border-gray-800 rounded-2xl overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-gray-800 flex justify-between items-center bg-gray-800/30">
                <h2 class="text-xl font-bold tracking-tight">INVENTARIO DISPONIBLE</h2>
                <span class="text-xs font-bold text-green-500 bg-green-500/10 px-3 py-1 rounded-full">DOMINICANA</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full">
                    <thead>
                        <tr class="text-left text-gray-500 text-xs uppercase tracking-widest border-b border-gray-800">
                            <th class="p-5">Modelo</th>
                            <th class="p-5">Capacidad</th>
                            <th class="p-5">Estado</th>
                            <th class="p-5 text-right">Precio RD$</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-800">
                        <tr class="hover:bg-green-500/5 transition group">
                            <td class="p-5 font-bold group-hover:hulk-text">Motorola Edge 50 Pro</td>
                            <td class="p-5 text-gray-400">512GB</td>
                            <td class="p-5"><span class="bg-green-900/30 text-green-400 text-[10px] font-bold px-2 py-1 rounded">NUEVO</span></td>
                            <td class="p-5 text-right font-black text-xl">RD$ 32,500</td>
                        </tr>
                        <tr class="hover:bg-green-500/5 transition group">
                            <td class="p-5 font-bold group-hover:hulk-text">Motorola Moto G84 5G</td>
                            <td class="p-5 text-gray-400">256GB</td>
                            <td class="p-5"><span class="bg-green-900/30 text-green-400 text-[10px] font-bold px-2 py-1 rounded">NUEVO</span></td>
                            <td class="p-5 text-right font-black text-xl">RD$ 13,900</td>
                        </tr>
                        <tr class="hover:bg-green-500/5 transition group">
                            <td class="p-5 font-bold group-hover:hulk-text">Motorola Razr 40 Ultra</td>
                            <td class="p-5 text-gray-400">256GB</td>
                            <td class="p-5"><span class="bg-blue-900/30 text-blue-400 text-[10px] font-bold px-2 py-1 rounded">OPEN BOX</span></td>
                            <td class="p-5 text-right font-black text-xl">RD$ 41,000</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Botón WhatsApp -->
        <div class="mt-12 text-center">
            <a href="https://wa.me" class="inline-flex items-center bg-green-600 hover:bg-green-500 text-white font-bold py-4 px-10 rounded-full transition-all transform hover:scale-105 shadow-xl shadow-green-900/20">
                <i class="fab fa-whatsapp mr-3 text-2xl"></i> ORDENAR POR WHATSAPP
            </a>
        </div>
    </div>

</body>
</html>
